name: ci

on:
  push:
    branches: [main, "release/*"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build
        working-directory: apps/web
        run: npx next build

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check ask function
        working-directory: supabase/functions/ask
        run: deno check index.ts
      - name: Type-check legal function
        working-directory: supabase/functions/legal
        run: deno check index.ts
      - name: Type-check draft-document function
        working-directory: supabase/functions/draft-document
        run: deno check index.ts
      - name: Type-check private document functions
        run: |
          deno check supabase/functions/create-user-document-upload/index.ts
          deno check supabase/functions/process-user-document/index.ts
          deno check supabase/functions/ask-user-document/index.ts

  document-pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test document processing and Q&A logic
        run: |
          node --test supabase/functions/ask/logic.test.mjs
          node --test supabase/functions/_shared/openrouter-policy.test.mjs
          node --test supabase/functions/_shared/consent.test.mjs
          node --test supabase/functions/_shared/rate-limit.test.mjs
          node --test supabase/functions/_shared/ai/policy.test.mjs
          node --test supabase/functions/_shared/ai/security.test.mjs
          node --test supabase/functions/process-user-document/logic.test.mjs
          node --test supabase/functions/ask-user-document/logic.test.mjs
          node --test scripts/ingestion/constitution-structure.test.mjs
          node --test scripts/ingestion/chunking.test.mjs

  ocr-gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway requirements
        working-directory: services/unlimited-ocr-gateway
        run: pip install -r requirements.txt
      - name: Test OCR gateway
        working-directory: services/unlimited-ocr-gateway
        run: python -m unittest test_gateway

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: legalens
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Stub Supabase-managed schemas and roles (real Supabase has these built in)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/ci/supabase_stub.sql
      - name: Apply schema.sql
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Apply user document migration
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/user_documents_migration.sql
      - name: Verify user document migration is rerunnable
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/user_documents_migration.sql
      - name: Apply waitlist migration
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/waitlist_migration.sql
      - name: Apply matter management migration
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/matter_management_migration.sql
      - name: Apply lexical search migration
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/lexical_search_migration.sql
      - name: Verify matter and lexical migrations are rerunnable
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/matter_management_migration.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/lexical_search_migration.sql
      - name: Apply user consent migration
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/user_consent_migration.sql
      - name: Verify consent migration is rerunnable
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/user_consent_migration.sql
      - name: Two-user consent authorization tests
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/tests/user_consent_test.sql
      - name: Verify consent rollback and re-apply
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/rollbacks/user_consent_rollback.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/user_consent_migration.sql
      - name: Apply audit hardening migration (and verify idempotency)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/audit_hardening_migration.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/audit_hardening_migration.sql
      - name: Apply AI provider hardening migration (and verify idempotency)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/ai_provider_hardening_migration.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/ai_provider_hardening_migration.sql
      - name: Multi-table security & RLS tests
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d legalens -v ON_ERROR_STOP=1 -f database/tests/security_hardening_test.sql
